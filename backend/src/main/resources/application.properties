# ── Server ──
server.port=${PORT:8080}
server.address=0.0.0.0

# ── Datasource ──
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# as environment variables in Render. Do NOT hard-code secrets here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' validates + migrates schema; safe for production with proper backups
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# Defer datasource initialization until after context is ready
spring.jpa.defer-datasource-initialization=false

# ── Jackson ──
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
